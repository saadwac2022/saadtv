<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaadTV - سعد تي في</title>
    <style>
        body {
            font-family: "Tahoma", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            direction: rtl;
        }

        header {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 40px;
            text-align: center;
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #c0392b;
        }

        #message {
            margin-top: 20px;
            color: green;
            font-size: 18px;
            display: none;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>📺 سعد تي في - SaadTV</h1>
        <nav>
            <a href="#">الرئيسية</a>
            <a href="#">برامجنا</a>
            <a href="#">اتصل بنا</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>مرحبا بكم في سعد تي في!</h2>
            <p>نقدم لكم أفضل البرامج والفيديوهات الحصرية.</p>
            <button onclick="showMessage()">اضغط لمعرفة المزيد</button>
            <p id="message">شكراً لاهتمامك! ترقبوا المزيد من المحتوى الجديد.</p>
        </section>
    </main>

    <footer>
        <p>© 2025 سعد تي في - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById('message').style.display = 'block';
        }
    </script>

</body>
</html>
